[project]
name = "lgh-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
lgh-agent = "lgh_agent.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]